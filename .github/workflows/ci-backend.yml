name: CI Backend

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Cache SonarCloud packages
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build with Maven
        run: mvn clean compile --no-transfer-progress
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Tests + Jacoco coverage (≥80%)
        run: mvn verify --no-transfer-progress
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Verify Jacoco XML report exists
        run: |
          echo "=== Jacoco XML report ==="
          ls -la target/site/jacoco/jacoco.xml && echo "✅ jacoco.xml found" || echo "❌ jacoco.xml NOT found"

      - name: SonarCloud Analysis
        run: |
          mvn sonar:sonar --no-transfer-progress \
            -Dsonar.projectKey=Driss2102_passation-app \
            -Dsonar.organization=driss2102 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=$(pwd)/target/site/jacoco/jacoco.xml
          echo ""
          echo "=========================================="
          echo "  SonarCloud report:"
          echo "  https://sonarcloud.io/dashboard?id=Driss2102_passation-app"
          echo "=========================================="
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Upload Jacoco coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  deploy:
    name: Deploy to Cloudsmith
    runs-on: ubuntu-latest
    needs: build
    # Only deploy when a version tag is pushed (ex: v1.0.0)
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$TAG" >> $GITHUB_ENV
          echo "Deploying version: $TAG"

      - name: Set version in pom.xml
        run: mvn versions:set -DnewVersion=${{ env.VERSION }} --no-transfer-progress

      - name: Build JAR
        run: mvn package -DskipTests --no-transfer-progress
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Configure Maven settings for Cloudsmith
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>cloudsmith-passation</id>
                <username>token</username>
                <password>${{ secrets.CLOUDSMITH_API_KEY }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Deploy JAR to Cloudsmith
        run: |
          mvn deploy -DskipTests --no-transfer-progress
          echo ""
          echo "=========================================="
          echo "  ✅ Artifact deployed to Cloudsmith!"
          echo "  Version: ${{ env.VERSION }}"
          echo "  Repo: https://cloudsmith.io/~ci-cd-55oy/repos/passation-backend/packages/"
          echo "=========================================="
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
