name: CI Backend

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:

  # ══════════════════════════════════════════════════
  # JOB 1 — Build + Tests + Jacoco + SonarCloud
  #          → déclenché sur main ET master
  # ══════════════════════════════════════════════════
  build:
    name: 🔨 Build, Test & SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Compile
        run: mvn clean compile --no-transfer-progress
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Tests + Jacoco (≥80%)
        run: mvn verify --no-transfer-progress
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: SonarCloud
        run: |
          mvn sonar:sonar --no-transfer-progress \
            -Dsonar.projectKey=Driss2102_passation-app \
            -Dsonar.organization=driss2102 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=$(pwd)/target/site/jacoco/jacoco.xml
          echo "📊 SonarCloud: https://sonarcloud.io/dashboard?id=Driss2102_passation-app"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Upload Jacoco report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  # ══════════════════════════════════════════════════
  # JOB 2 — SNAPSHOT → Cloudsmith + deploy DEV
  #          → uniquement sur push main
  # ══════════════════════════════════════════════════
  snapshot-and-dev:
    name: 📦 SNAPSHOT + Deploy DEV
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: dev
      url: https://passation-dev.onrender.com

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Read base version
        run: |
          BASE=$(grep '^version=' src/main/resources/application.properties | cut -d'=' -f2 | tr -d ' ')
          echo "SNAPSHOT_VERSION=${BASE}-SNAPSHOT" >> $GITHUB_ENV
          echo "📦 Snapshot version: ${BASE}-SNAPSHOT"

      - name: Set SNAPSHOT version in pom.xml
        run: mvn versions:set -DnewVersion=${{ env.SNAPSHOT_VERSION }} --no-transfer-progress

      - name: Build SNAPSHOT JAR
        run: mvn package -DskipTests --no-transfer-progress
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Deploy SNAPSHOT → Cloudsmith
        run: |
          pip install --upgrade cloudsmith-cli -q
          cloudsmith push maven ci-cd-55oy/passation-backend-snapshots \
            target/passation-backend.jar \
            --pom-file=pom.xml \
            --api-key=${{ secrets.CLOUDSMITH_API_KEY }}
          echo ""
          echo "=========================================="
          echo "  📦 SNAPSHOT deployed to Cloudsmith!"
          echo "  Version : ${{ env.SNAPSHOT_VERSION }}"
          echo "  Repo    : https://cloudsmith.io/~ci-cd-55oy/repos/passation-backend-snapshots/packages/"
          echo "=========================================="

      - name: Deploy → Render DEV
        run: |
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_DEV }}"
          echo "🟡 DEV deployment triggered: https://passation-dev.onrender.com"

  # ══════════════════════════════════════════════════
  # JOB 3 — RELEASE → Cloudsmith + deploy HOMOL
  #          → uniquement sur push master
  # ══════════════════════════════════════════════════
  release-and-homol:
    name: 🚀 RELEASE + Deploy HOMOL
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment:
      name: homol
      url: https://passation-homol.onrender.com

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Auto-increment release version
        run: |
          BASE=$(grep '^version=' src/main/resources/application.properties | cut -d'=' -f2 | tr -d ' ')
          PATCH=$(git tag --list "v${BASE}.*" | wc -l | tr -d ' ')
          VERSION="${BASE}.${PATCH}"
          while git tag --list | grep -q "^v${VERSION}$"; do
            PATCH=$((PATCH + 1))
            VERSION="${BASE}.${PATCH}"
          done
          echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV
          echo "🚀 Release version: $VERSION"

      - name: Set RELEASE version in pom.xml
        run: mvn versions:set -DnewVersion=${{ env.RELEASE_VERSION }} --no-transfer-progress

      - name: Build RELEASE JAR
        run: mvn package -DskipTests --no-transfer-progress
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Create Git tag
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag "v${{ env.RELEASE_VERSION }}"
          git push origin "v${{ env.RELEASE_VERSION }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy RELEASE → Cloudsmith
        run: |
          pip install --upgrade cloudsmith-cli -q
          cloudsmith push maven ci-cd-55oy/passation-backend \
            target/passation-backend.jar \
            --pom-file=pom.xml \
            --api-key=${{ secrets.CLOUDSMITH_API_KEY }}
          echo ""
          echo "=========================================="
          echo "  🚀 RELEASE deployed to Cloudsmith!"
          echo "  Version : ${{ env.RELEASE_VERSION }}"
          echo "  Repo    : https://cloudsmith.io/~ci-cd-55oy/repos/passation-backend/packages/"
          echo "=========================================="

      - name: Deploy → Render HOMOL
        run: |
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_HOMOL }}"
          echo "🟠 HOMOL deployment triggered: https://passation-homol.onrender.com"

  # ══════════════════════════════════════════════════
  # JOB 4 — Deploy PROD (approbation manuelle requise)
  #          → uniquement après release-and-homol validé
  # ══════════════════════════════════════════════════
  deploy-prod:
    name: 🔴 Deploy PROD
    runs-on: ubuntu-latest
    needs: release-and-homol
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment:
      name: prod
      url: https://passation-prod.onrender.com

    steps:
      - name: Deploy → Render PROD
        run: |
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_PROD }}"
          echo ""
          echo "=========================================="
          echo "  🔴 PROD deployment triggered!"
          echo "  URL: https://passation-prod.onrender.com"
          echo "=========================================="
