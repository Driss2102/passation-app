name: CI Backend

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 — Build + Tests + Sonar (main & master)
  # ─────────────────────────────────────────────
  build:
    name: Build, Test & SonarCloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Cache SonarCloud packages
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build with Maven
        run: mvn clean compile --no-transfer-progress
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Tests + Jacoco coverage (≥80%)
        run: mvn verify --no-transfer-progress
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: SonarCloud Analysis
        run: |
          mvn sonar:sonar --no-transfer-progress \
            -Dsonar.projectKey=Driss2102_passation-app \
            -Dsonar.organization=driss2102 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=$(pwd)/target/site/jacoco/jacoco.xml
          echo "SonarCloud: https://sonarcloud.io/dashboard?id=Driss2102_passation-app"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Upload Jacoco report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  # ─────────────────────────────────────────────
  # JOB 2 — SNAPSHOT deploy (main only)
  # ─────────────────────────────────────────────
  snapshot:
    name: Deploy SNAPSHOT to Cloudsmith
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Read base version from application.properties
        run: |
          BASE=$(grep '^version=' src/main/resources/application.properties | cut -d'=' -f2 | tr -d ' ')
          echo "BASE_VERSION=$BASE" >> $GITHUB_ENV
          echo "SNAPSHOT_VERSION=${BASE}-SNAPSHOT" >> $GITHUB_ENV
          echo "Base version: $BASE"
          echo "Snapshot version: ${BASE}-SNAPSHOT"

      - name: Set SNAPSHOT version in pom.xml
        run: mvn versions:set -DnewVersion=${{ env.SNAPSHOT_VERSION }} --no-transfer-progress

      - name: Build SNAPSHOT JAR
        run: mvn package -DskipTests --no-transfer-progress
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Install Cloudsmith CLI
        run: pip install --upgrade cloudsmith-cli

      - name: Deploy SNAPSHOT to Cloudsmith
        run: |
          JAR="target/passation-backend-${{ env.SNAPSHOT_VERSION }}.jar"
          cloudsmith push maven ci-cd-55oy/passation-backend-snapshots \
            "$JAR" \
            --pom-file=pom.xml \
            --api-key=${{ secrets.CLOUDSMITH_API_KEY }}
          echo ""
          echo "=========================================="
          echo "  📦 SNAPSHOT deployed!"
          echo "  Version : ${{ env.SNAPSHOT_VERSION }}"
          echo "  Repo    : https://cloudsmith.io/~ci-cd-55oy/repos/passation-backend-snapshots/packages/"
          echo "=========================================="

  # ─────────────────────────────────────────────
  # JOB 3 — RELEASE deploy (master only)
  # ─────────────────────────────────────────────
  release:
    name: Deploy RELEASE to Cloudsmith
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Read base version + auto-increment patch
        run: |
          BASE=$(grep '^version=' src/main/resources/application.properties | cut -d'=' -f2 | tr -d ' ')
          echo "Base version from application.properties: $BASE"

          # Count existing tags matching v{BASE}.* to determine next patch
          PATCH=$(git tag --list "v${BASE}.*" | wc -l | tr -d ' ')
          RELEASE_VERSION="${BASE}.${PATCH}"

          # Make sure version does not already exist as a tag
          while git tag --list | grep -q "^v${RELEASE_VERSION}$"; do
            PATCH=$((PATCH + 1))
            RELEASE_VERSION="${BASE}.${PATCH}"
          done

          echo "BASE_VERSION=$BASE"         >> $GITHUB_ENV
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> $GITHUB_ENV
          echo "PATCH=$PATCH"               >> $GITHUB_ENV
          echo "Release version: $RELEASE_VERSION"

      - name: Set RELEASE version in pom.xml
        run: mvn versions:set -DnewVersion=${{ env.RELEASE_VERSION }} --no-transfer-progress

      - name: Build RELEASE JAR
        run: mvn package -DskipTests --no-transfer-progress
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Install Cloudsmith CLI
        run: pip install --upgrade cloudsmith-cli

      - name: Deploy RELEASE to Cloudsmith
        run: |
          JAR="target/passation-backend-${{ env.RELEASE_VERSION }}.jar"
          cloudsmith push maven ci-cd-55oy/passation-backend \
            "$JAR" \
            --pom-file=pom.xml \
            --api-key=${{ secrets.CLOUDSMITH_API_KEY }}
          echo ""
          echo "=========================================="
          echo "  🚀 RELEASE deployed!"
          echo "  Version : ${{ env.RELEASE_VERSION }}"
          echo "  Repo    : https://cloudsmith.io/~ci-cd-55oy/repos/passation-backend/packages/"
          echo "=========================================="

      - name: Create Git tag for this release
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag "v${{ env.RELEASE_VERSION }}"
          git push origin "v${{ env.RELEASE_VERSION }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
