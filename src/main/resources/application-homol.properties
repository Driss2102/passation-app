# ── HOMOLOGATION environment ─────────────────────
server.port=${PORT:8080}

# PostgreSQL Neon (homol database)
spring.datasource.url=jdbc:postgresql://${PGHOST_HOMOL}/neondb?sslmode=require
spring.datasource.username=${PGUSER_HOMOL}
spring.datasource.password=${PGPASSWORD_HOMOL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

# CORS
app.cors.allowed-origins=${FRONTEND_URL:*}
